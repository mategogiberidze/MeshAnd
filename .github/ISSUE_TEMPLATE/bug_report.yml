name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: meshand
    attributes:
      label: MeshAnd version
      description: Shown in MeshAnd → Settings → About, e.g. 0.2.0
    validations:
      required: true
  - type: input
    id: phone
    attributes:
      label: Phone and Android version
      placeholder: e.g. Pixel 8, Android 15
    validations:
      required: true
  - type: input
    id: radio
    attributes:
      label: Radio and Meshtastic firmware version
      placeholder: e.g. LILYGO T-Beam Supreme, 2.7.26
  - type: input
    id: osmand
    attributes:
      label: OsmAnd version and edition
      placeholder: e.g. OsmAnd 5.4.8 (free, Google Play)
  - type: textarea
    id: logs
    attributes:
      label: Logs (optional)
      description: |
        Output of `adb logcat -s MeshAnd MeshAnd/SDK MeshAnd/OsmAnd MeshAnd/Alerts`, if you can.
        MeshAnd never logs channel keys, but check before pasting anyway.
      render: text
