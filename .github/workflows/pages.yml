name: Pages

# Publishes the project site to GitHub Pages: the landing page (site/index.html) at the root
# and the guides (docs/*.md, CHANGELOG.md) under /docs/, built by site/build.sh with MkDocs.
# Needs Settings → Pages → Source: GitHub Actions.

on:
  push:
    branches: [main]
    paths:
      - site/**
      - docs/**
      - CHANGELOG.md
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: site/requirements.txt

      - name: Build the site
        run: |
          pip install -r site/requirements.txt
          ./site/build.sh

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/site

      - id: deployment
        uses: actions/deploy-pages@v5
