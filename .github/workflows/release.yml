name: Release

# Push a tag matching the app version to publish a signed APK as a GitHub Release:
#   git tag v0.4.1 && git push origin v0.4.1
on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the GitHub Release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # all tags, for the "changes since" link in the release notes

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v6

      - name: Check tag matches versionName
        id: version
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $version in app/build.gradle.kts"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The text under "## <version>" up to the next "## " heading.
          awk -v v="$version" '/^## / { if (found) exit; if ($2 == v) { found = 1; next } } found' CHANGELOG.md > release-notes.md
          if [ -z "$(tr -d '[:space:]' < release-notes.md)" ]; then
            echo "::error::CHANGELOG.md has no '## $version' section. Write the release notes first."
            exit 1
          fi
          previous=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          {
            echo
            echo "### Download"
            echo
            echo "Install **MeshAnd-$version.apk** below on your Android phone (Android 7 or newer)."
            echo "The \`.sha256\` file lets you check the download."
            if [ -n "$previous" ]; then
              echo
              echo "All code changes: https://github.com/$GITHUB_REPOSITORY/compare/$previous...$GITHUB_REF_NAME"
            fi
          } >> release-notes.md
          cat release-notes.md

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.MESHAND_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MESHAND_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Secrets MESHAND_KEYSTORE_BASE64 / MESHAND_KEYSTORE_PASSWORD are not set (see README)"
            exit 1
          fi
          mkdir -p signing
          echo "$KEYSTORE_BASE64" | base64 -d > signing/meshand-release.jks
          {
            echo "storeFile=../signing/meshand-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=meshand"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > keystore.properties

      - name: Unit tests and signed release build
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease

      - name: Verify signature and package the APK
        id: apk
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk
          name="MeshAnd-${{ steps.version.outputs.version }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$name"
          sha256sum "$name" > "$name.sha256"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.apk.outputs.name }}" "${{ steps.apk.outputs.name }}.sha256" \
            --title "MeshAnd ${{ steps.version.outputs.version }}" \
            --notes-file release-notes.md

      - name: Remove signing material
        if: always()
        run: rm -f signing/meshand-release.jks keystore.properties
